# Local PostgreSQL for development and tests.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jams
      POSTGRES_PASSWORD: jams
      POSTGRES_DB: jams
    ports:
      - '5432:5432'
    volumes:
      - jams-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  jams-db:
